# Checks the scripts and publishes setup.sh at https://sganis.github.io/up
# Actions are pinned by commit: they publish what gets run with curl | sh.
# Two jobs, like GitHub's official example: publishing in the same job that
# uploads the site sometimes fails to find it ("Found 0 artifacts").
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck -s sh setup.sh
          shellcheck bin/* test/*.sh
      - name: tests
        run: |
          bash test/down.sh
          bash test/up.sh
      - name: build the site
        run: |
          mkdir _site
          cp setup.sh _site/index.html
          cp setup.sh _site/setup.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
